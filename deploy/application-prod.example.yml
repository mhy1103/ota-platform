# 生产环境配置示例。复制成和 jar 同目录的 application-prod.yml，启动时加 --spring.profiles.active=prod
# 敏感值（主密钥、数据库密码、对象存储密钥）建议放环境变量，不要提交到代码仓库。

server:
  port: 8812

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ota_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ota
    password: ${OTA_DB_PASSWORD}

ota:
  data-dir: /www/ota-platform/data
  public-url: https://ota.example.com
  master-key: ${OTA_MASTER_KEY}

  # 对象存储（可选）。不配置时文件存在 data-dir/blobs
  # storage:
  #   type: s3
  #   s3:
  #     # 阿里云 OSS：endpoint https://oss-cn-hangzhou.aliyuncs.com，region oss-cn-hangzhou，path-style false
  #     # 腾讯云 COS：endpoint https://cos.ap-guangzhou.myqcloud.com，region ap-guangzhou，path-style false
  #     # MinIO：endpoint http://127.0.0.1:9000，region us-east-1，path-style true
  #     endpoint: https://oss-cn-hangzhou.aliyuncs.com
  #     region: oss-cn-hangzhou
  #     bucket: my-ota-bucket
  #     access-key: ${OTA_S3_ACCESS_KEY}
  #     secret-key: ${OTA_S3_SECRET_KEY}
  #     path-style: false
  #     prefix: ota/
  #     # bucket 设为公共读，或者给 bucket 配 CDN，这里填 CDN 地址
  #     public-url: https://cdn.example.com
