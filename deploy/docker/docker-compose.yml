# 在项目根目录运行：docker compose -f deploy/docker/docker-compose.yml up -d
# 数据（数据库、文件、主密钥）在项目根目录的 data 下，备份这个目录即可。
services:
  ota:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ota-platform:1.0.0
    restart: unless-stopped
    ports:
      - "8812:8812"
    volumes:
      - ../../data:/data
    environment:
      # App 和浏览器访问的地址，清单里的下载地址以它为前缀
      OTA_PUBLICURL: "https://ota.example.com"
      # 首次启动时的后台管理员密码（账号 admin）和管理令牌；不填会随机生成并打印在日志里
      OTA_ADMIN_PASSWORD: ""
      OTA_BOOTSTRAP_TOKEN: ""
      # 用 MySQL 时取消下面三行的注释，并启动 mysql 服务
      # SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/ota_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8"
      # SPRING_DATASOURCE_USERNAME: "ota"
      # SPRING_DATASOURCE_PASSWORD: "change-me"

