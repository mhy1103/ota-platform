server:
  port: 8812
  # 换 jar 重启时，正在上传的包、正在拉清单的设备先处理完再停
  shutdown: graceful
  # 加载壳和 /vue 下的脚本样式压缩传输（页面数据在 PageData 里压缩）；App 拿的启动包（application/javascript）、清单和接口原样返回
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript
    min-response-size: 4096
  servlet:
    session:
      # 登录会话存在数据库里（spring_session 表），重启服务不用重新登录。
      # 实际有效期按「系统配置 → 登录安全」：勾了「记住我」保持 N 天，没勾时空闲一段时间退出
      timeout: 7d
      cookie:
        name: OTA_SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: ota-platform
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # /vue 下的前端文件名带内容哈希（boot.js 带 ?v=打包版本），内容变了地址就变，浏览器缓存一年
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          cache-private: true
  # 默认用 H2 文件库，零配置启动。生产环境建议 MySQL：
  #   url: jdbc:mysql://127.0.0.1:3306/ota_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
  datasource:
    url: jdbc:h2:file:${ota.data-dir}/db/ota;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  session:
    jdbc:
      initialize-schema: always
      cleanup-cron: "0 */10 * * * *"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  jackson:
    default-property-inclusion: non_null

ota:
  # 数据目录：数据库、文件、主密钥都在这里
  data-dir: ./data
  # 对外地址（App 和浏览器访问的地址），清单里的下载地址以它为前缀
  public-url: http://localhost:8812
  # 后台显示时间用的时区
  display-zone: Asia/Shanghai
  # 加密签名私钥等敏感数据的主密钥（32 字节 Base64）。不配置时自动生成到数据目录的 master.key
  master-key: ${OTA_MASTER_KEY:}
  # 初始管理令牌（命令行 / CI 用）。不配置时首次启动随机生成并在日志里打印一次
  bootstrap-token: ${OTA_BOOTSTRAP_TOKEN:}
  # 后台管理员初始密码（账号 admin）。不配置时首次启动随机生成并在日志里打印一次
  admin-password: ${OTA_ADMIN_PASSWORD:}
  # 单个文件上传上限（字节）
  max-asset-bytes: 209715200

  storage:
    # local：存在数据目录；s3：S3 兼容对象存储（阿里云 OSS、腾讯云 COS、七牛、MinIO、AWS S3、Cloudflare R2）
    type: local
    s3:
      endpoint:
      region: us-east-1
      bucket:
      access-key: ${OTA_S3_ACCESS_KEY:}
      secret-key: ${OTA_S3_SECRET_KEY:}
      # 路径风格（endpoint/bucket/key）。MinIO 一般用 true，OSS / COS 用 false（bucket.endpoint/key）
      path-style: false
      # 对象名前缀
      prefix: ota/
      # App 下载文件用的地址（CDN 或 bucket 的公网地址），对象名直接拼在后面
      public-url:

  patch:
    # 启动包增量更新：为最近几个版本生成 bsdiff 补丁，设备只下载差异
    enabled: true
    # 每次发布为最近几个版本生成补丁
    bases: 3
    # 补丁超过完整文件的这个比例就不用补丁
    max-ratio: 0.8
